<!DOCTYPE html>
<html>
<head>
  <title>EE Breath</title>
  <link rel="stylesheet" href="index.css">

</head>
<body>
  <div id="controls" duration="{$$duration}">
    <span style="zoom: 0.7;">🫁</span>
    <input :bind="$$duration" onmouseup="[$$stop()]" 
           type="range" value="" min="10" max="30" step="1"/>
    <span>🫁</span>
    <button onclick="[$$play()]">PLAY</button>
    <button onclick="[$$stop()]">STOP</button>
  </div>
  <div id="lung">
    <div></div> <!-- big ball -->

    <div></div> <!-- 1:2 -->
    <div></div> <!-- 2 -->
    <div></div> <!-- 3 -->
    <div></div> <!-- 4 -->
    <div></div> <!-- 5:6 -->

    <div></div> <!-- 7 -->

    <div></div> <!-- 1:8-->
    <div></div> <!-- 2:9 -->

    <div></div> <!-- 3 -->

    <div></div> <!-- 1:11 -->
    <div></div> <!-- 2 -->
    <div></div> <!-- 3 -->
    <div></div> <!-- 4 -->
    <div></div> <!-- 5 -->
    <div></div> <!-- 6 -->
    <div></div> <!-- 7 -->
    <div></div> <!-- 8:18 -->

    <div></div> <!-- 9 -->

    <div></div> <!-- 1 -->
    <div></div> <!-- 2 -->
    
    <div></div> <!-- 3 -->

    <div></div> <!-- small ball -->
  </div>
  
  <script src="https://raw.githubusercontent.com/mailcmd/kss-js/refs/heads/main/kss.js" load="bundle"></script>
  <script defer src="index.js"></script>
</body>    
</html>
